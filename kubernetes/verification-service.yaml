apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verification-keys-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verification-service
  namespace: default
  labels:
    app: verification-service
spec:
  replicas: 1 # Needs to be 1 to avoid conflicts over the same PVC if ReadWriteOnce is used
  selector:
    matchLabels:
      app: verification-service
  template:
    metadata:
      labels:
        app: verification-service
    spec:
      containers:
        - name: verification-service
          image: secure-dist/verification-service:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          env:
            - name: SERVICES_LOGGING_URL
              value: "http://logging-service:8085"
            - name: KEYS_DIR
              value: "/app/keys"
          volumeMounts:
            - name: keys-volume
              mountPath: /app/keys
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: keys-volume
          persistentVolumeClaim:
            claimName: verification-keys-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: verification-service
  namespace: default
spec:
  ports:
    - port: 8084
      targetPort: 8084
  selector:
    app: verification-service
