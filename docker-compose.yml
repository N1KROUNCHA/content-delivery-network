# version attribute removed (obsolete in modern Docker Compose)

services:
  logging-service:
    build:
      context: ./logging-service
      dockerfile: Dockerfile
    container_name: logging-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/logging_db
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    depends_on:
      - postgres-db
    networks:
      - secure-dist-net

  verification-service:
    build:
      context: ./verification-service
      dockerfile: Dockerfile
    container_name: verification-service
    ports:
      - "8084:8084"
    volumes:
      - ./keys:/app/keys
    environment:
      - SERVICES_LOGGING_URL=http://logging-service:8085
    depends_on:
      - logging-service
    networks:
      - secure-dist-net

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SERVICES_LOGGING_URL=http://logging-service:8085
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    depends_on:
      - logging-service
      - postgres-db
    networks:
      - secure-dist-net

  content-service:
    build:
      context: ./content-service
      dockerfile: Dockerfile
    container_name: content-service
    ports:
      - "8082:8082"
    environment:
      - SERVICES_VERIFICATION_URL=http://verification-service:8084
      - SERVICES_LOGGING_URL=http://logging-service:8085
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/content_db
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      - AWS_S3_REGION=${AWS_S3_REGION:-ap-south-2}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - verification-service
      - logging-service
      - postgres-db
      - redis
    networks:
      - secure-dist-net

  download-service:
    build:
      context: ./download-service
      dockerfile: Dockerfile
    container_name: download-service
    ports:
      - "8083:8083"
    environment:
      - SERVICES_CONTENT_URL=http://content-service:8082
      - SERVICES_VERIFICATION_URL=http://verification-service:8084
      - SERVICES_LOGGING_URL=http://logging-service:8085
    depends_on:
      - content-service
      - verification-service
      - logging-service
    networks:
      - secure-dist-net

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      - SERVICES_AUTH_URL=http://auth-service:8081
      - SERVICES_CONTENT_URL=http://content-service:8082
      - SERVICES_DOWNLOAD_URL=http://download-service:8083
      - SERVICES_LOGGING_URL=http://logging-service:8085
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-5}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-5}
    depends_on:
      - auth-service
      - content-service
      - download-service
      - redis
    networks:
      - secure-dist-net

  demo-client:
    build:
      context: ./demo-client
      dockerfile: Dockerfile
    container_name: demo-client
    ports:
      - "8087:8086"
    volumes:
      - ./client_downloads:/app/client_downloads
    environment:
      - SERVICES_GATEWAY_URL=http://gateway-service:8080/api
    depends_on:
      - gateway-service
    networks:
      - secure-dist-net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - secure-dist-net

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - gateway-service
      - demo-client
    networks:
      - secure-dist-net

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    networks:
      - secure-dist-net

networks:
  secure-dist-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
