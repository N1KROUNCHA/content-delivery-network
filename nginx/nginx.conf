events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Hide hop-by-hop headers from upstream responses to prevent duplicates
    proxy_hide_header Transfer-Encoding;
    proxy_hide_header Connection;

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS: Demo Client UI (port 443) ──────────────────────────────
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        client_max_body_size 100M;

        # Demo Client UI proxy using dynamic DNS resolution
        location / {
            set $client_upstream demo-client;
            proxy_pass         http://$client_upstream:8086;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }

    # ── HTTPS: API Gateway (port 8443) ────────────────────────────────
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        # File upload size limit
        client_max_body_size 100M;

        # API Gateway proxy using dynamic DNS resolution
        location / {
            set $gateway_upstream gateway-service;
            proxy_pass         http://$gateway_upstream:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
